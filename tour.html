<script>

    theme: {

          alpenglow:'#C97B3D', rust:'#8B3A2B',
          navy:'#0F5875', navydeep:'#02445E',
          brandred:'#DC292B', brandreddeep:'#A81F21',
          iceblue:'#51B1DB'

<!-- ============================================================
     PLAN I PROGRAM — interni stilovi (fontovi/tokeni iz vanjskog style.css)
     Sve je ograničeno na .planSection.
     ============================================================ -->
<style>
  .planSection{ padding: clamp(48px,7vw,88px) 20px clamp(64px,9vw,110px); }
  .planWrap{ max-width: 900px; margin: 0 auto; }

  /* ---- Naslov iznad timeline-a ---- */
  .planHeading{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em; line-height:1.25; font-size: clamp(1.45rem,3.6vw,2.15rem); color:var(--forest); text-align:center; max-width:26ch; margin:0 auto clamp(34px,5vw,52px); }

  /* ---- Timeline ---- */
  .planTrack{ --nodeCol: 92px; list-style:none; margin:0; padding:0; position:relative; }
  @media (max-width:600px){ .planTrack{ --nodeCol: 64px; } }
  .planTrack::before{ content:""; position:absolute; top:14px; bottom:14px; left: calc(var(--nodeCol) / 2); width:2px; background: linear-gradient(to bottom, transparent, var(--stone) 5%, var(--stone) 95%, transparent); }

  .planRow{ position:relative; display:grid; grid-template-columns: var(--nodeCol) 1fr; gap: clamp(14px,3vw,26px); align-items:center; padding: 9px 0; animation: planIn .5s var(--ease) both; }
  @keyframes planIn{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .planRow{ animation:none; } }

  /* Krug sa datumom */
  .planNode{ justify-self:center; z-index:1; width: clamp(54px,13vw,72px); height: clamp(54px,13vw,72px); border-radius:50%; background:#fff; border:2px solid var(--stone); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1; box-shadow: 0 10px 22px -14px rgba(14,51,42,.35); transition: border-color .3s var(--ease), background .3s var(--ease), transform .3s var(--ease); }
  .planRow:hover .planNode{ transform: translateY(-2px); border-color: rgba(85,122,70,.5); }
  .planDay{ font-family:'Fraunces',serif; font-weight:600; font-size: clamp(1.2rem,3.4vw,1.55rem); color:var(--forest); }
  .planMon{ font-family:'Inter',sans-serif; font-size:.62rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--moss); margin-top:2px; }

  /* Kartica događaja */
  .planCard{ position:relative; background:#fff; border:1px solid var(--stone); border-radius:16px; padding: clamp(15px,2.4vw,20px) clamp(16px,2.6vw,22px); box-shadow: 0 14px 30px -26px rgba(14,51,42,.5); transition: transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease); }
  .planRow:hover .planCard{ transform: translateY(-3px); box-shadow: 0 22px 44px -28px rgba(14,51,42,.6); border-color: rgba(85,122,70,.4); }
  .planCardTop{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:8px; }
  .planTitle{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em; line-height:1.25; font-size: clamp(1.05rem,2.4vw,1.25rem); color:var(--charcoal); }
  .planRange{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.04em; color:var(--moss); background:rgba(85,122,70,.1); padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .planNext{ font-family:'Inter',sans-serif; font-size:.66rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--moss); padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .planMeta{ display:flex; align-items:center; gap:8px; font-size:.9rem; color: rgba(30,30,30,.62); }
  .planMetaLabel{ font-family:'Inter',sans-serif; font-weight:600; color:var(--moss); }

  /* ---- Dugmad "Prikaži više / sve / manje" ---- */
  .planActions{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px; margin-top: clamp(28px,4vw,42px); }
  .planBtn{ display:inline-flex; align-items:center; gap:8px; font-family:'Inter',sans-serif; font-weight:600; font-size:.9rem; padding:12px 26px; border-radius:999px; cursor:pointer; transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease), border-color .25s var(--ease); }
  .planBtn svg{ transition: transform .25s var(--ease); }
  .planBtn.primary{ background:var(--forest); color:var(--beige); border:1px solid var(--forest); }
  .planBtn.primary:hover{ background:var(--forestDeep); transform:translateY(-2px); box-shadow:0 12px 26px -12px rgba(14,51,42,.5); }
  .planBtn.primary:hover svg{ transform:translateY(2px); }
  .planBtn.ghost{ background:transparent; color:var(--forest); border:1px solid rgba(24,77,59,.35); }
  .planBtn.ghost:hover{ background:rgba(24,77,59,.06); transform:translateY(-2px); }

  /* Prazno stanje */
  .planEmpty{ text-align:center; padding: clamp(28px,5vw,44px) 20px; color: rgba(30,30,30,.6); }
  .planEmpty svg{ color: var(--moss); opacity:.6; margin:0 auto 12px; }
  .planEmpty p{ font-size:1rem; line-height:1.6; max-width:34ch; margin:0 auto; }

  /* Dark mode — uskladjeno sa ostatkom sajta */
  @media (prefers-color-scheme: dark){
    body.supportsDark .planHeading{ color:var(--beige); }
    body.supportsDark .planNode{ background:#182B23; border-color:rgba(246,243,238,.18); }
    body.supportsDark .planDay{ color:var(--beige); }
    body.supportsDark .planCard{ background:#16261F; border-color:rgba(246,243,238,.14); }
    body.supportsDark .planTitle{ color:var(--beige); }
    body.supportsDark .planMeta{ color:rgba(246,243,238,.6); }
    body.supportsDark .planTrack::before{ background: linear-gradient(to bottom, transparent, rgba(246,243,238,.16) 5%, rgba(246,243,238,.16) 95%, transparent); }
    body.supportsDark .planBtn.primary{ background:var(--moss); border-color:var(--moss); color:#fff; }
    body.supportsDark .planBtn.primary:hover{ background:#4a6b3c; }
    body.supportsDark .planBtn.ghost{ color:var(--beige); border-color:rgba(246,243,238,.28); }
    body.supportsDark .planBtn.ghost:hover{ background:rgba(246,243,238,.08); }
  }
</style>
</head>
<body class="bg-beige text-charcoal font-sans supportsDark">

<section class="planSection">

<script src="assets/script.js" defer></script>

<!-- ============================================================
     PLAN I PROGRAM — podaci + logika (interno)
     Prikaz NADOLAZEĆIH aktivnosti za tekuću godinu.
     PODACI SE UČITAVAJU IZ assets/data/tours.json — da doda/izmijeni/obriše
     turu, uredi TAJ file (nije potrebno dirati ovaj script).
     Format unosa: { "date":"YYYY-MM-DD", "range":"opcionalno", "title":"...", "leader":"..." }
     ============================================================ -->
<script>
(function(){
  var TOURS_JSON_URL = 'assets/data/tours.json';
  var MON_ABBR = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
  var STEP = 5;

  var EVENTS = [];
  var upcoming = [];
  var shown = 0;

  var elTrack   = document.getElementById('planTrack');
  var elActions = document.getElementById('planActions');

  function parse(d){ var p = d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

  function showError(){
    elTrack.innerHTML =
      '<li class="planEmpty">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg>' +
        '<p>Plan trenutno nije dostupan. Pokušaj ponovo malo kasnije.</p>' +
      '</li>';
    elActions.innerHTML = '';
  }

  function showLoading(){
    elTrack.innerHTML = '<li class="planEmpty"><p>Učitavanje plana…</p></li>';
  }

  function init(data){
    EVENTS = (data && data.events) ? data.events : [];

    EVENTS.forEach(function(e){ e.dateObj = parse(e.date); });
    EVENTS.sort(function(a,b){ return a.dateObj - b.dateObj; });

    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

    // Samo nadolazeći događaji (od danas nadalje)
    upcoming = EVENTS.filter(function(e){ return e.dateObj >= today; });

    shown = Math.min(STEP, upcoming.length);

    render();
  }

  showLoading();
  fetch(TOURS_JSON_URL, { cache: 'no-cache' })
    .then(function(res){ if(!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(init)
    .catch(function(){ showError(); });

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function makeBtn(label, variant, arrow, handler){
    var b = document.createElement('button');
    b.className = 'planBtn ' + variant;
    var icon = '';
    if(arrow === 'down') icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    if(arrow === 'up')   icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    b.innerHTML = '<span>' + label + '</span>' + icon;
    b.addEventListener('click', handler);
    return b;
  }

  function render(){
    elTrack.innerHTML = '';

    if(upcoming.length === 0){
      var li = document.createElement('li');
      li.className = 'planEmpty';
      li.innerHTML =
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg>' +
        '<p>Trenutno nema najavljenih aktivnosti. Provjeri ponovo uskoro.</p>';
      elTrack.appendChild(li);
      elActions.innerHTML = '';
      return;
    }

    var list = upcoming.slice(0, shown);
    list.forEach(function(e, i){
      var d = e.dateObj;
      var li = document.createElement('li');
      li.className = 'planRow';
      li.style.animationDelay = (i % STEP * 55) + 'ms';

      var nextHtml  = (i === 0) ? '<span class="planNext">Sljedeće</span>' : '';
      var rangeHtml = e.range ? '<span class="planRange">' + esc(e.range) + '</span>' : '';

      li.innerHTML =
        '<div class="planNode">' +
          '<span class="planDay">' + d.getDate() + '</span>' +
          '<span class="planMon">' + MON_ABBR[d.getMonth()] + '</span>' +
        '</div>' +
        '<div class="planCard">' +
          '<div class="planCardTop">' +
            '<span class="planTitle">' + esc(e.title) + '</span>' +
            rangeHtml + nextHtml +
          '</div>' +
          '<div class="planMeta"><span class="planMetaLabel">Vodič:</span> ' + esc(e.leader) + '</div>' +
        '</div>';
      elTrack.appendChild(li);
    });

    // Dugmad
    elActions.innerHTML = '';
    if(upcoming.length > STEP){
      if(shown < upcoming.length){
        elActions.appendChild(makeBtn('Prikaži više', 'primary', 'down', function(){
          shown = Math.min(shown + STEP, upcoming.length);
          render();
        }));
        elActions.appendChild(makeBtn('Prikaži sve', 'ghost', null, function(){
          shown = upcoming.length;
          render();
        }));
      } else {
        elActions.appendChild(makeBtn('Prikaži manje', 'ghost', 'up', function(){
          shown = STEP;
          render();
          elTrack.scrollIntoView({ behavior:'smooth', block:'start' });
        }));
      }
    }
  }
})();
</script>

</body>
