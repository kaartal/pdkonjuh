<style>
  /* ============================================================ */
  /* HERO SECTION — SAME MARKUP/STYLES AS ABOUT.HTML, SCOPED UNDER .ABOUTHERO */
  /* ============================================================ */
  :root{
    --g:#2F5D50; --g2:#1D3D34; --ol:#6B8E23; --ol2:#5a7a1c; --bg:#F5F1E8; --amb:#C97B3D;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  @keyframes onBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(4px);}}

  /* MAIN GALLERY GRID: SCALE + BLUR REVEAL WITH STAGGER (GALLERY.HTML ONLY) */
  .galleryReveal{
    opacity:0;
    transform:scale(.92) translateY(22px);
    filter:blur(10px);
    transition:opacity .95s var(--ease), transform .95s var(--ease), filter .95s var(--ease);
    will-change:opacity, transform, filter;
  }
  .galleryReveal.isVisible{
    opacity:1;
    transform:scale(1) translateY(0);
    filter:blur(0);
  }
  /* SUBTLE CONTINUOUS HOVER LIFT, LAYERED ON TOP OF THE REVEAL TRANSITION */
  .galleryItem{transition:box-shadow .5s var(--ease);}

  /* IMAGE ONLY FADES/UNBLURS IN ONCE FULLY LOADED — NEVER PAINTS HALF-FINISHED */
  .imgFade{
    opacity:0;
    filter:blur(14px);
    transition:opacity 1.1s var(--ease), filter 1.1s var(--ease);
  }
  .imgFade.imgLoaded{
    opacity:1;
    filter:blur(0);
  }
  @media (prefers-reduced-motion: reduce){
    .galleryReveal{opacity:1;transform:none;filter:none;transition:none;}
    .imgFade{opacity:1;filter:none;transition:none;}
  }

  /* ============================================================ */
  /* CATEGORY FILTER BAR */
  /* ============================================================ */
  .categoryBar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.6rem;
    margin-bottom:2.5rem;
  }
  .categoryBtn{
    font-family:'Inter', sans-serif;
    font-size:.85rem;
    font-weight:600;
    padding:.80rem 1.50rem;
    border-radius:999px;
    border:1px solid rgba(24,77,59,.35);
    background:transparent;
    cursor:pointer;
    transition:background-color .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease), transform .2s var(--ease);
  }
  .categoryBtn:hover{
    border-color:#184D3B;
    transform:translateY(-1px);
  }
  .categoryBtn.isActive{
    background:#184D3B;
    border-color:#184D3B;
    color:#F6F3EE;
  }
  .galleryItemHidden{
    display:none !important;
  }

  /* ============================================================ */
  /* LIGHTBOX WITH SWIPE / ARROW NAVIGATION */
  /* ============================================================ */
  .lightboxOverlay{
  position:fixed;
  inset:0;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:1.5rem;
  touch-action:pan-y;
}
  .lightboxOverlay.isOpen{
    display:flex;
  }
  .lightboxFigure{
    position:relative;
    max-width:min(90vw, 1100px);
    max-height:88vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lightboxImg{
    max-width:100%;
    max-height:88vh;
    border-radius:.75rem;
    object-fit:contain;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    opacity:0;
    transform:scale(.97);
    transition:opacity .25s var(--ease), transform .25s var(--ease);
  }
  .lightboxImg.isShown{
    opacity:1;
    transform:scale(1);
  }
  .lightboxClose,
  .lightboxNav{
    position:fixed;
    background:rgba(246,243,238,.12);
    color:#F6F3EE;
    border:none;
    border-radius:999px;
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background-color .2s var(--ease), transform .2s var(--ease);
    z-index:10000;
  }
  .lightboxClose:hover,
  .lightboxNav:hover{
    background:rgba(246,243,238,.25);
  }
  .lightboxClose{
    top:1.25rem;
    right:1.25rem;
  }
  .lightboxNav{
    top:50%;
    transform:translateY(-50%);
  }
  .lightboxNav:hover{ transform:translateY(-50%) scale(1.05); }
  .lightboxPrev{ left:1.25rem; }
  .lightboxNext{ right:1.25rem; }
  .lightboxNav svg, .lightboxClose svg{ width:22px; height:22px; }
  @media (max-width: 640px){
    .lightboxNav{ width:40px; height:40px; }
    .lightboxPrev{ left:.5rem; }
    .lightboxNext{ right:.5rem; }
    .lightboxClose{ top:.75rem; right:.75rem; width:40px; height:40px; }
  }
</style>

<!-- LIGHTBOX MARKUP: BUILT/CONTROLLED ENTIRELY BY THE SCRIPT BELOW -->
<div id="lightboxOverlay" class="lightboxOverlay" role="dialog" aria-modal="true" aria-label="Pregled slike">
  <button type="button" id="lightboxClose" class="lightboxClose" aria-label="Zatvori pregled">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button type="button" id="lightboxPrev" class="lightboxNav lightboxPrev" aria-label="Prethodna slika">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="lightboxFigure">
    <img id="lightboxImg" class="lightboxImg" src="" alt="">
  </div>
  <button type="button" id="lightboxNext" class="lightboxNav lightboxNext" aria-label="Sljedeća slika">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>

<script src="assets/script.js" defer></script>
<script>
  // REVEAL EACH GALLERY IMAGE ONLY ONCE FULLY LOADED, SO IT NEVER PAINTS
  // HALF-FINISHED — IT FADES/UNBLURS IN SMOOTHLY INSTEAD.
  document.querySelectorAll('.imgFade').forEach(function (img) {
    if (img.complete && img.naturalWidth > 0) {
      img.classList.add('imgLoaded');
    } else {
      img.addEventListener('load', function () { img.classList.add('imgLoaded'); });
      img.addEventListener('error', function () { img.classList.add('imgLoaded'); });
    }
  });

  // TRIGGERS A SLOW, STAGGERED FADE-IN FOR .GALLERYREVEAL ITEMS AS THEY ENTER
  // THE VIEWPORT, SO THE WHOLE GALLERY "SETTLES" GRADUALLY INSTEAD OF POPPING
  // IN ALL AT ONCE.
  var galleryObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('isVisible');
        galleryObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.galleryReveal').forEach(function (el, i) {
    el.style.transitionDelay = ((i % 8) * 0.09) + 's';
    galleryObserver.observe(el);
  });

  // NEWLY REVEALED IMAGES (.GALLERYITEMEXTRA) NEED TO BE RE-OBSERVED AFTER
  // "PRIKAŽI VIŠE" IS CLICKED, SINCE THEY WERE display:none DURING THE
  // OBSERVER'S FIRST PASS AND COULDN'T BE FLAGGED AS VISIBLE THEN.
  var showMoreBtn = document.getElementById('galleryShowMoreButton');
  var showMoreClicked = false;
  if (showMoreBtn) {
    showMoreBtn.addEventListener('click', function () {
      showMoreClicked = true;
      setTimeout(function () {
        document.querySelectorAll('.galleryItemExtra:not(.hidden)').forEach(function (el, i) {
          if (!el.classList.contains('isVisible')) {
            el.style.transitionDelay = ((i % 6) * 0.09) + 's';
            galleryObserver.observe(el);
          }
        });
      }, 0);
    });
  }

  // ============================================================
  // KATEGORIJE — FILTRIRANJE GALERIJE PO 4 KATEGORIJE + "SVE"
  // ============================================================
  (function () {
    var categoryBar = document.getElementById('categoryBar');
    if (!categoryBar) return;

    var categoryButtons = Array.prototype.slice.call(categoryBar.querySelectorAll('.categoryBtn'));
    var allItems = Array.prototype.slice.call(document.querySelectorAll('#galleryGrid .galleryItem'));
    var currentFilter = 'sve';

    function applyFilter(filter) {
      currentFilter = filter;

      categoryButtons.forEach(function (btn) {
        var active = btn.dataset.filter === filter;
        btn.classList.toggle('isActive', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      allItems.forEach(function (item) {
        var isExtra = item.classList.contains('galleryItemExtra');

        if (filter === 'sve') {
          // Vrati na podrazumijevano stanje: osnovne slike vidljive,
          // "extra" slike vidljive samo ako je "Prikaži više" već kliknuto.
          if (isExtra) {
            item.classList.toggle('hidden', !showMoreClicked);
          } else {
            item.classList.remove('hidden');
          }
          item.classList.remove('galleryItemHidden');
        } else {
          var matches = item.dataset.category === filter;
          item.classList.toggle('galleryItemHidden', !matches);
          if (matches && !item.classList.contains('isVisible')) {
            item.classList.add('isVisible');
          }
        }
      });

      // Kad je aktivan filter kategorije, dugme "Prikaži više" nema smisla
      // jer se sve slike te kategorije već prikazuju odjednom.
      if (showMoreBtn) {
        showMoreBtn.style.display = (filter === 'sve') ? '' : 'none';
      }
    }

    categoryButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        applyFilter(btn.dataset.filter);
      });
    });
  })();

  // ============================================================
  // LIGHTBOX SA NAVIGACIJOM LIJEVO/DESNO (STRELICE, TIPKE, SWIPE)
  // ============================================================
  (function () {
    var overlay = document.getElementById('lightboxOverlay');
    var imgEl = document.getElementById('lightboxImg');
    var closeBtn = document.getElementById('lightboxClose');
    var prevBtn = document.getElementById('lightboxPrev');
    var nextBtn = document.getElementById('lightboxNext');
    if (!overlay || !imgEl) return;

    var currentIndex = -1;
    var currentSet = [];

    function getVisibleTriggers() {
      return Array.prototype.slice.call(document.querySelectorAll('#galleryGrid [data-gallery-lightbox]'))
        .filter(function (el) {
          return !el.classList.contains('hidden') && !el.classList.contains('galleryItemHidden');
        });
    }

    function openAt(index) {
      currentSet = getVisibleTriggers();
      if (!currentSet.length) return;
      currentIndex = ((index % currentSet.length) + currentSet.length) % currentSet.length;
      showCurrent();
      overlay.classList.add('isOpen');
      document.body.style.overflow = 'hidden';
    }

    function showCurrent() {
      var trigger = currentSet[currentIndex];
      if (!trigger) return;
      var full = trigger.getAttribute('data-full');
      var altSrc = trigger.querySelector('img');
      imgEl.classList.remove('isShown');
      var swap = function () {
        imgEl.src = full;
        imgEl.alt = altSrc ? altSrc.alt : '';
        imgEl.onload = function () { imgEl.classList.add('isShown'); };
      };
      swap();
    }

    function close() {
      overlay.classList.remove('isOpen');
      document.body.style.overflow = '';
    }

    function next() {
      if (!currentSet.length) return;
      currentIndex = (currentIndex + 1) % currentSet.length;
      showCurrent();
    }

    function prev() {
      if (!currentSet.length) return;
      currentIndex = (currentIndex - 1 + currentSet.length) % currentSet.length;
      showCurrent();
    }

    document.querySelectorAll('#galleryGrid [data-gallery-lightbox]').forEach(function (trigger) {
      trigger.addEventListener('click', function () {
        var visible = getVisibleTriggers();
        var idx = visible.indexOf(trigger);
        openAt(idx === -1 ? 0 : idx);
      });
    });

    if (closeBtn) closeBtn.addEventListener('click', close);
    if (nextBtn) nextBtn.addEventListener('click', next);
    if (prevBtn) prevBtn.addEventListener('click', prev);

    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) close();
    });

    document.addEventListener('keydown', function (e) {
      if (!overlay.classList.contains('isOpen')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    });

    // SWIPE LIJEVO/DESNO NA TOUCH UREĐAJIMA
    var touchStartX = 0;
    var touchStartY = 0;
    var SWIPE_THRESHOLD = 40;

    overlay.addEventListener('touchstart', function (e) {
      var t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });

    overlay.addEventListener('touchend', function (e) {
      var t = e.changedTouches[0];
      var dx = t.clientX - touchStartX;
      var dy = t.clientY - touchStartY;
      if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) { next(); } else { prev(); }
      }
    }, { passive: true });
  })();
</script>
