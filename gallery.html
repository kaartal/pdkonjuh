<!-- ============================================================
     HERO SECTION (SAME AS ON ABOUT.HTML, SCOPED UNDER .aboutHero)
     ============================================================ -->
<style>
  :root{
    --g:#2F5D50; --g2:#1D3D34; --ol:#6B8E23; --ol2:#5a7a1c; --bg:#F5F1E8; --amb:#C97B3D;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  @keyframes onBob{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(4px);}}

  .aboutHero{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:#2a2a2a;line-height:1.75;}
  .aboutHero img{display:block;max-width:100%;}
  .aboutHero a{text-decoration:none;color:inherit;}

  .aboutHero .hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;color:#fff;}
  .aboutHero .heroBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;animation:heroBgBreathe 22s ease-in-out infinite;will-change:transform;}
  @keyframes heroBgBreathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
  }
  .aboutHero .heroOv1{position:absolute;inset:0;z-index:1;background:linear-gradient(to bottom,rgba(13,26,22,.3) 0%,rgba(13,26,22,.6) 60%,rgba(13,26,22,.85) 100%);}
  .aboutHero .heroOv2{position:absolute;inset:0;z-index:2;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.4) 100%);}
  .aboutHero .heroContent{position:relative;z-index:3;padding:0 28px;max-width:820px;}
  .aboutHero .hero h1{font-family:'Fraunces',serif;font-optical-sizing:auto;font-size:clamp(3.2rem,8vw,6rem);font-weight:600;line-height:1.05;letter-spacing:-.02em;margin-bottom:24px;text-shadow:0 4px 32px rgba(0,0,0,.3);color:#fff;animation:heroTextIn 1.6s var(--ease) both;animation-delay:.35s;}
  .aboutHero .heroSub{font-family:'Fraunces',serif;font-optical-sizing:auto;font-size:clamp(1.15rem,2.4vw,1.5rem);color:rgba(255,255,255,.9);font-weight:400;font-style:italic;letter-spacing:.01em;max-width:560px;margin:0 auto 48px;line-height:1.65;animation:heroTextIn 1.6s var(--ease) both;animation-delay:.75s;}
  @keyframes heroTextIn{
    from{opacity:0;transform:translateY(26px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .aboutHero .heroBg{animation:none;}
    .aboutHero .hero h1,.aboutHero .heroSub{animation:none;opacity:1;transform:none;}
  }
  .aboutHero .heroBadge{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px;padding:7px 18px;background:rgba(255,255,255,.1);border-radius:999px;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);}
  .aboutHero .heroBadgeDot{width:6px;height:6px;border-radius:50%;background:var(--amb);display:inline-block;}
  .aboutHero .heroBadgeText{font-family:'Poppins',sans-serif;font-size:.75rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85);}
  .aboutHero .heroBtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .aboutHero .btnPrimary{display:inline-flex;align-items:center;gap:8px;background:var(--ol);color:#fff;padding:13px 30px;border-radius:999px;font-family:'Poppins',sans-serif;font-weight:700;font-size:.93rem;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s;}
  .aboutHero .btnPrimary:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.4);background:var(--ol2);}
  .aboutHero .btnGhost{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#fff;padding:13px 30px;border-radius:999px;font-family:'Poppins',sans-serif;font-weight:600;font-size:.93rem;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);transition:background .25s;}
  .aboutHero .btnGhost:hover{background:rgba(255,255,255,.22);}
  .aboutHero .scrollCue{position:absolute;bottom:66px;left:50%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;color:rgba(255,255,255,.5);animation:onBob 2.6s ease-in-out infinite;}
  .aboutHero .scrollArrow{width:22px;height:28px;stroke:currentColor;}

  /* ---- MAIN GALLERY GRID: MODERN SCALE + BLUR REVEAL (STAGGERED) — GALLERY.HTML ONLY ---- */
  .galleryReveal{
    opacity:0;
    transform:scale(.92) translateY(22px);
    filter:blur(10px);
    transition:opacity .7s var(--ease), transform .7s var(--ease), filter .7s var(--ease);
    will-change:opacity, transform, filter;
  }
  .galleryReveal.isVisible{
    opacity:1;
    transform:scale(1) translateY(0);
    filter:blur(0);
  }
  /* SUBTLE CONTINUOUS HOVER LIFT ON TOP OF THE REVEAL (DOESN'T FIGHT THE REVEAL TRANSFORM) */
  .galleryItem{transition:box-shadow .5s var(--ease);}

  /* ---- SLOW, SMOOTH IMAGE FADE-IN — ONLY REVEALS ONCE FULLY LOADED ----
     Prevents the "half painted, then finishes" flash on slower connections:
     the <img> stays invisible + softly blurred + slightly zoomed until its
     'load' event fires, then eases in over ~1.1s instead of popping in. */
  .imgFade{
    opacity:0;
    filter:blur(14px);
    transition:opacity 1.1s var(--ease), filter 1.1s var(--ease);
  }
  .imgFade.imgLoaded{
    opacity:1;
    filter:blur(0);
  }
  @media (prefers-reduced-motion: reduce){
    .galleryReveal{opacity:1;transform:none;filter:none;transition:none;}
    .imgFade{opacity:1;filter:none;transition:none;}
  }
</style>

<script src="assets/script.js" defer></script>
<script>
  // Reveal each gallery image only once it's FULLY loaded, so it never
  // paints in half-finished — it fades/unblurs in smoothly instead.
  document.querySelectorAll('.imgFade').forEach(function (img) {
    if (img.complete && img.naturalWidth > 0) {
      img.classList.add('imgLoaded');
    } else {
      img.addEventListener('load', function () { img.classList.add('imgLoaded'); });
      img.addEventListener('error', function () { img.classList.add('imgLoaded'); });
    }
  });
</script>
